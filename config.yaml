# ============================================================
# Arxiv-tracker 配置文件
#
# 研究方向：
# Internet Social Media Analysis
# Social Event Detection
#
# 项目目标：
# 1. 自动发现相关论文
# 2. 对论文进行简单中文总结
# 3. 帮助快速判断是否值得进一步阅读
#
# 论文的详细方法、实验和创新由后续人工阅读完成
# ============================================================


# ============================================================
# 1. arXiv 分类
# ============================================================

categories:
  - "cs.SI"   # Social and Information Networks
  - "cs.IR"   # Information Retrieval
  - "cs.CL"   # Computation and Language / NLP
  - "cs.LG"   # Machine Learning
  - "cs.AI"   # Artificial Intelligence


# ============================================================
# 2. 搜索关键词
#
# 注意：
# Arxiv-tracker 会自动在：
# - title
# - abstract
# - comments
#
# 中搜索关键词，并自动处理部分空格/连字符变体。
#
# 因此不要配置过多近义词，否则容易出现：
#
# 414 URI Too Long
#
# keywords 内部是 OR 关系。
# ============================================================

keywords:

  # 核心 Social Event Detection
  - "social event detection"
  - "social media event detection"

  # Event Discovery / Clustering
  - "event discovery"
  - "event clustering"

  # 无监督事件检测
  - "unsupervised event detection"

  # 增量 / 在线事件检测
  - "incremental event detection"
  - "online event detection"

  # 新兴事件发现
  - "emerging event detection"

  # 图方法
  - "graph-based event detection"

  # 多模态
  - "multimodal event detection"


# ============================================================
# 3. 排除关键词
#
# 避免 event detection 匹配到明显无关方向。
#
# 排除词也不要设置太多，
# 否则同样会增加 arXiv 查询 URL 长度。
# ============================================================

exclude_keywords:

  # Event Camera
  - "event camera"

  # 视频事件检测
  - "video event detection"

  # 医学事件检测
  - "clinical event detection"
  - "adverse event detection"


# ============================================================
# 4. 查询逻辑
#
# 实际逻辑大致为：
#
# (cs.SI OR cs.IR OR cs.CL OR cs.LG OR cs.AI)
#
# AND
#
# (
#   social event detection
#   OR social media event detection
#   OR event discovery
#   OR ...
# )
#
# AND NOT
#
# (
#   event camera
#   OR video event detection
#   OR ...
# )
# ============================================================

logic: "AND"


# ============================================================
# 5. 每次最多获取论文数量
# ============================================================

max_results: 30


# ============================================================
# 6. 排序方式
#
# lastUpdatedDate：
# 按最近更新时间排序。
#
# 适合每日追踪新论文和论文更新。
# ============================================================

sort_by: "lastUpdatedDate"
sort_order: "descending"


# ============================================================
# 7. 输出语言
#
# zh   = 中文
# en   = 英文
# both = 中英文
# ============================================================

lang: "both"


# ============================================================
# 8. 摘要设置
#
# 使用 LLM 做简单摘要。
#
# tldr：
# 只生成简短总结，
# 不进行详细 Method Card / 深入分析。
# ============================================================

summary:
  mode: "llm"
  scope: "tldr"


# ============================================================
# 9. 邮件发送
# ============================================================

email:

  enabled: true

  # 邮件标题
  subject: "[arXiv] Social Event Detection Daily Digest"

  # QQ 邮箱 SMTP
  smtp_server: "smtp.qq.com"
  smtp_port: 465

  # GitHub Actions Secret：
  # SMTP_PASS
  #
  # 注意：
  # 使用 QQ 邮箱 SMTP 授权码，
  # 不是 QQ 登录密码。
  smtp_pass_env: "SMTP_PASS"

  # auto / ssl / starttls
  tls: "ssl"

  # SMTP 调试
  debug: false

  # simple / full
  detail: "full"

  # 邮件最多展示 30 篇
  max_items: 30

  # 附加 Markdown 文件
  attach_md: true

  # 不附加 PDF
  attach_pdf: false


# ============================================================
# 10. LLM 配置
#
# 当前使用：
# SiliconFlow + Qwen2.5-7B-Instruct
#
# 这里只负责简单理解摘要并生成简短总结。
# ============================================================

llm:

  provider: "openai-compatible"

  # SiliconFlow
  base_url: "https://api.siliconflow.cn"

  # 模型
  model: "Qwen/Qwen2.5-7B-Instruct"

  # GitHub Actions Secret：
  # OPENAI_COMPAT_API_KEY
  api_key_env: "OPENAI_COMPAT_API_KEY"


  # ----------------------------------------------------------
  # 如果以后使用 DeepSeek，可以改成：
  #
  # base_url: "https://api.deepseek.com"
  # model: "deepseek-chat"
  # api_key_env: "DS_API_KEY"
  # ----------------------------------------------------------


  # ==========================================================
  # 英文摘要 Prompt
  # ==========================================================

  system_prompt_en: |
    You are an academic paper assistant focusing on Social Event Detection
    and social media analysis.

    Based on the provided paper title, metadata, and abstract,
    write a short and clear summary.

    Briefly explain:
    1. what problem the paper studies,
    2. what main method it uses,
    3. what main result or conclusion it reports.

    If relevant, briefly indicate whether the paper is related to
    social event detection, event discovery, event clustering,
    online or incremental detection, graph-based methods,
    or multimodal methods.

    Keep the summary concise and objective.
    Do not invent information that is not provided.


  # ==========================================================
  # 中文摘要 Prompt
  # ==========================================================

  system_prompt_zh: |
    你是一个面向互联网社交媒体分析与
    Social Event Detection 的论文阅读助手。

    请根据论文标题、元信息和摘要，
    用一段简洁中文概括论文主要内容。

    简单说明：
    1. 论文研究什么问题；
    2. 使用了什么主要方法；
    3. 得到了什么主要结果或结论。

    如果适用，可以简单指出论文属于：
    社交事件检测、事件发现、事件聚类、
    在线/增量检测、图方法或多模态方法中的哪一类。

    保持简洁、客观。
    不要补充原文中没有提供的信息。


# ============================================================
# 11. 中文翻译
#
# 翻译论文标题和原始摘要。
# ============================================================

translate:

  enabled: true

  lang: "zh"

  fields:
    - "title"
    - "summary"


# ============================================================
# 12. GitHub Pages
# ============================================================

site:

  enabled: true

  # 网站生成目录
  dir: "docs"

  # 网站标题
  title: "Social Event Detection 论文速递"

  # 保留历史页面数量
  keep_runs: 1024

  # light / dark / auto
  theme: "light"

  # 主题色
  accent: "#2563eb"


# ============================================================
# 13. Freshness & 去重
# ============================================================

freshness:

  # ----------------------------------------------------------
  # 当前设置：
  #
  # 3650 = 大约过去 10 年
  #
  # 第一次运行适合用于补历史论文。
  #
  # 等历史论文扫描完成后，
  # 推荐修改为：
  #
  # since_days: 7
  #
  # 用于日常追踪。
  # ----------------------------------------------------------

  since_days: 3650

  # 已经出现过的论文不重复推送
  unique_only: true

  # 去重状态保存位置
  state_path: ".state/seen.json"

  # 如果今天没有新论文，
  # 不使用旧论文补齐
  fallback_when_empty: false


# ============================================================
# 14. 代码 / 项目主页抓取
#
# 自动尝试查找：
# - GitHub
# - Code
# - Project Page
# - Dataset
# ============================================================

scrape:

  # 优先读取 arXiv HTML 页面
  html: true

  # HTML 中没找到时尝试 PDF
  pdf_if_missing: true

  # 不强制扫描每篇 PDF 第一页
  pdf_first_page: false

  # 请求超时时间
  timeout: 10
