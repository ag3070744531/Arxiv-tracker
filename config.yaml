# ============================================================
# Arxiv-tracker：社交事件检测近 5 年回溯配置
#
# 用途：
#   1. 首次运行时回溯近 5 年相关论文；
#   2. 重点覆盖社交媒体、社交网络、微博与社交流中的事件检测；
#   3. 首次回溯关闭邮件和 LLM，避免一次处理大量论文产生超时或费用。
#
# 首次回溯完成后，建议：
#   - freshness.since_days 改为 7
#   - freshness.unique_only 改为 true
#   - max_results 改为 20
#   - 按需将 summary.mode 改为 llm
#   - 确认结果正常后再启用 email.enabled
# ============================================================

categories:
  - "cs.SI"   # Social and Information Networks
  - "cs.IR"   # Information Retrieval
  - "cs.CL"   # Computation and Language
  - "cs.LG"   # Machine Learning
  - "cs.AI"   # Artificial Intelligence
  - "cs.MM"   # Multimedia

# 每个关键词会在 title / abstract / comments 中检索；
# keywords 之间是 OR，下面各短语均与社交事件检测直接相关。
keywords:
  - "social event detection"
  - "social media event detection"
  - "event detection on social media"
  - "event detection in social media"
  - "event detection from social media"
  - "social event discovery"
  - "social media event discovery"
  - "social event clustering"
  - "social media event clustering"
  - "microblog event detection"
  - "social stream event detection"
  - "social event evolution"
  - "social media event evolution"

# 当前版本的排除语法可能存在兼容性问题，保持为空最稳妥。
exclude_keywords: []

# 必须同时满足：属于上述分类之一，并匹配上述短语之一。
logic: "AND"

# 首次回溯允许收集较多记录；程序会自动分页。
max_results: 500

# 以最近更新时间为准，可包含近 5 年内更新过的论文版本。
sort_by: "lastUpdatedDate"
sort_order: "descending"

lang: "both"

# 五年回溯时使用低成本摘要模式。
# 若直接启用 llm，最多可能产生数百次模型调用。
summary:
  mode: "heuristic"
  scope: "tldr"

translate:
  enabled: false
  lang: "zh"
  fields:
    - "title"
    - "summary"

# 首次回溯不要发送可能包含数百篇论文的邮件。
email:
  enabled: false
  subject: "[arXiv] Social Event Detection Literature Backfill"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 20
  attach_md: true
  attach_pdf: false

site:
  enabled: true
  dir: "docs"
  title: "Social Event Detection 论文追踪"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

freshness:
  # 2021-09-11 至 2026-09-11 跨过 2024 闰日，共约 1826 天。
  since_days: 1826
  # 首次历史回溯必须关闭去重，避免已有 seen.json 把旧论文全部过滤掉。
  # 完成回溯并切换为日常追踪时，再改回 true。
  unique_only: false
  state_path: ".state/seen.json"
  fallback_when_empty: false

# 首次大批量回溯关闭额外页面/PDF请求，缩短运行时间。
# 日常增量阶段可以重新开启 html 和 pdf_if_missing。
scrape:
  html: false
  pdf_if_missing: false
  pdf_first_page: false
  timeout: 10
