# ============================================================
# Arxiv-tracker 配置文件
#
# 研究方向：
# Internet Social Media Analysis
# Social Event Detection
#
# 项目目标：
# 1. 自动发现相关论文
# 2. 对论文进行简单总结
# 3. 帮助快速判断是否值得进一步阅读
#
# 论文的详细方法、实验和创新由人工阅读完成
# ============================================================


# ============================================================
# 1. arXiv 分类
# ============================================================

categories:
  - "cs.SI"   # Social and Information Networks
  - "cs.IR"   # Information Retrieval
  - "cs.CL"   # Computation and Language / NLP
  - "cs.LG"   # Machine Learning
  - "cs.AI"   # Artificial Intelligence


# ============================================================
# 2. 搜索关键词
#
# Arxiv-tracker 会自动在：
# - title
# - abstract
# - comments
#
# 中搜索关键词，并自动处理空格/连字符变体。
#
# keywords 内部为 OR。
# 不设置过多关键词，避免 414 URI Too Long。
# ============================================================

keywords:

  # 核心 Social Event Detection
  - "social event detection"
  - "social media event detection"

  # Event Discovery / Clustering
  - "event discovery"
  - "event clustering"

  # 无监督事件检测
  - "unsupervised event detection"

  # 增量 / 在线事件检测
  - "incremental event detection"
  - "online event detection"

  # 新兴事件检测
  - "emerging event detection"

  # 图方法
  - "graph-based event detection"

  # 多模态
  - "multimodal event detection"


# ============================================================
# 3. 排除关键词
#
# 避免 event detection 匹配到明显无关领域。
# ============================================================

exclude_keywords:

  # Event Camera
  - "event camera"

  # 视频事件检测
  - "video event detection"

  # 医学事件检测
  - "clinical event detection"
  - "adverse event detection"


# ============================================================
# 4. 查询逻辑
#
# 实际逻辑：
#
# (categories...)
# AND
# (keywords...)
# AND NOT
# (exclude_keywords...)
# ============================================================

logic: "AND"


# ============================================================
# 5. 每次最多获取论文数量
# ============================================================

max_results: 30


# ============================================================
# 6. 排序方式
#
# lastUpdatedDate：
# 按最近更新时间排序。
# ============================================================

sort_by: "lastUpdatedDate"
sort_order: "descending"


# ============================================================
# 7. 输出语言
#
# zh   = 中文
# en   = 英文
# both = 中英文
# ============================================================

lang: "both"


# ============================================================
# 8. 摘要设置
#
# 使用 LLM 生成简短 TL;DR。
# 不生成详细 Method Card。
# ============================================================

summary:
  mode: "llm"
  scope: "tldr"


# ============================================================
# 9. 邮件发送
# ============================================================

email:

  enabled: true

  # 邮件标题
  subject: "[arXiv] Social Event Detection Daily Digest"

  # QQ 邮箱 SMTP
  smtp_server: "smtp.qq.com"
  smtp_port: 465

  # GitHub Actions Secret：
  # SMTP_PASS
  #
  # 使用 QQ 邮箱 SMTP 授权码，
  # 不是 QQ 登录密码。
  smtp_pass_env: "SMTP_PASS"

  # auto / ssl / starttls
  tls: "ssl"

  # SMTP 调试
  debug: false

  # simple / full
  detail: "full"

  # 邮件最多展示 30 篇
  max_items: 30

  # 附加 Markdown 文件
  attach_md: true

  # 不附加 PDF
  attach_pdf: false


# ============================================================
# 10. LLM 配置
#
# 使用：
# DeepSeek-V4-Flash-Vision-Exp
#
# DeepSeek 官方 OpenAI-Compatible API
# ============================================================

llm:

  provider: "openai-compatible"

  # DeepSeek API
  base_url: "https://api.deepseek.com"

  # DeepSeek V4 Flash Vision Experimental
  model: "deepseek-v4-flash-vision-exp"

  # GitHub Actions Secret：
  #
  # DS_API_KEY
  #
  # 注意：
  # 这里必须填写 DeepSeek 官方 API Key。
  api_key_env: "DS_API_KEY"


  # ==========================================================
  # 英文摘要 Prompt
  # ==========================================================

  system_prompt_en: |
    You are an academic paper assistant focusing on Social Event Detection
    and social media analysis.

    Based on the provided paper title, metadata, and abstract,
    write a short and clear summary.

    Briefly explain:
    1. what problem the paper studies,
    2. what main method it uses,
    3. what main result or conclusion it reports.

    Keep the summary concise and objective.
    Do not invent information that is not provided.


  # ==========================================================
  # 中文摘要 Prompt
  # ==========================================================

  system_prompt_zh: |
    你是一个面向互联网社交媒体分析与
    Social Event Detection 的论文阅读助手。

    请根据论文标题、元信息和摘要，
    用一段简洁中文概括论文主要内容。

    简单说明：
    1. 论文研究什么问题；
    2. 使用了什么主要方法；
    3. 得到了什么主要结果或结论。

    保持简洁、客观。
    不要补充原文中没有提供的信息。


# ============================================================
# 11. 中文翻译
#
# 翻译论文标题和原始摘要。
# ============================================================

translate:

  enabled: true

  lang: "zh"

  fields:
    - "title"
    - "summary"


# ============================================================
# 12. GitHub Pages
# ============================================================

site:

  enabled: true

  # 网站生成目录
  dir: "docs"

  # 网站标题
  title: "Social Event Detection 论文速递"

  # 保留历史页面数量
  keep_runs: 1024

  # light / dark / auto
  theme: "light"

  # 页面主题色
  accent: "#2563eb"


# ============================================================
# 13. Freshness & 去重
# ============================================================

freshness:

  # ----------------------------------------------------------
  # 第一次初始化时可以使用：
  #
  # since_days: 3650
  #
  # 用于补充历史论文。
  #
  # 等历史论文初始化完成后，
  # 建议修改为：
  #
  # since_days: 7
  #
  # 用于日常追踪。
  # ----------------------------------------------------------

  since_days: 3650

  # 已经出现过的论文不重复推送
  unique_only: true

  # 去重状态文件
  state_path: ".state/seen.json"

  # 今天没有新论文时，
  # 不拿旧论文补齐
  fallback_when_empty: false


# ============================================================
# 14. 论文代码 / 项目主页抓取
# ============================================================

scrape:

  # 优先读取 arXiv HTML
  html: true

  # HTML 没找到代码链接时，
  # 尝试 PDF
  pdf_if_missing: true

  # 不强制扫描每篇 PDF 第一页
  pdf_first_page: false

  # 网络请求超时时间
  timeout: 10
