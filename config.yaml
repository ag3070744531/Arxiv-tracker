# ============================================================
# Arxiv-tracker 配置文件
#
# 研究方向：
# Social Media Analysis
# Social Event Detection
#
# 功能目标：
# 1. 自动发现 Social Event Detection 相关论文
# 2. 使用 LLM 做简单摘要
# 3. 帮助快速判断论文是否值得进一步阅读
#
# 当前采用：
# 高精度关键词 + 较短查询字符串
# ============================================================


# ============================================================
# 1. arXiv 分类
# ============================================================

categories:
  - "cs.SI"   # Social and Information Networks
  - "cs.IR"   # Information Retrieval
  - "cs.CL"   # NLP
  - "cs.LG"   # Machine Learning


# ============================================================
# 2. 搜索关键词
#
# 注意：
# 当前程序会把每一个关键词扩展到：
#
# title
# abstract
# comments
#
# 同时还会自动生成连字符变体，
# 所以关键词数量不能设置太多。
#
# keywords 之间为 OR。
#
# 当前原则：
# 每一个关键词本身都必须能够较明确地指向
# Social Event Detection / Social Media Event Detection。
# ============================================================

keywords:

  # 核心任务
  - "social event detection"
  - "social media event detection"

  # 社交事件发现
  - "social event discovery"
  - "social media event discovery"

  # 社交事件聚类
  - "social event clustering"

  # 无监督方向
  - "unsupervised social event detection"

  # 增量 / 在线方向
  - "incremental social event detection"
  - "online social event detection"

  # 微博客场景
  - "microblog event detection"


# ============================================================
# 3. 排除关键词
#
# 当前暂时关闭。
#
# 原因：
# 当前 query.py 中排除逻辑存在：
#
# AND NOT
#
# 的 arXiv 查询语法问题。
#
# 在 query.py 修复为 ANDNOT 之前，
# 保持空列表最安全。
#
# 由于现在所有正向关键词已经绑定 Social，
# 即使不使用 exclude_keywords，
# 无关论文数量也会比之前少很多。
# ============================================================

exclude_keywords: []


# ============================================================
# 4. 查询逻辑
#
# 实际为：
#
# (
#   cs.SI
#   OR cs.IR
#   OR cs.CL
#   OR cs.LG
# )
#
# AND
#
# (
#   social event detection
#   OR social media event detection
#   OR ...
# )
# ============================================================

logic: "AND"


# ============================================================
# 5. 最大论文数量
#
# 每次最多获取 20 篇符合条件的论文。
# 实际新论文可能少于 20 篇。
# ============================================================

max_results: 20


# ============================================================
# 6. 排序
#
# 按论文最近更新时间排序。
# ============================================================

sort_by: "lastUpdatedDate"
sort_order: "descending"


# ============================================================
# 7. 输出语言
#
# 主要面向中文阅读，
# 因此直接使用 zh。
#
# 原始英文标题、作者和 arXiv 链接仍然保留。
# ============================================================

lang: "zh"


# ============================================================
# 8. LLM 摘要
#
# 只做简单 TL;DR。
#
# 不进行：
# - 详细方法分析
# - 数据集分析
# - 指标分析
# - 创新点分析
# - 局限性分析
# ============================================================

summary:
  mode: "llm"
  scope: "tldr"


# ============================================================
# 9. 邮件配置
# ============================================================

email:

  enabled: true

  subject: "[arXiv] Social Event Detection Daily Digest"

  smtp_server: "smtp.qq.com"
  smtp_port: 465

  # GitHub Secret：
  #
  # SMTP_PASS
  #
  # 必须使用 QQ 邮箱 SMTP 授权码
  smtp_pass_env: "SMTP_PASS"

  tls: "ssl"

  debug: false

  detail: "full"

  # 每封邮件最多显示 20 篇
  max_items: 20

  # 附加 Markdown
  attach_md: true

  # 不附加论文 PDF
  attach_pdf: false


# ============================================================
# 10. LLM 配置
#
# 使用：
# deepseek-v4-flash-vision-exp
#
# API Key：
# GitHub Actions Secret -> DS_API_KEY
# ============================================================

llm:

  provider: "openai-compatible"

  base_url: "https://api.deepseek.com"

  model: "deepseek-v4-flash-vision-exp"

  api_key_env: "DS_API_KEY"


  # ----------------------------------------------------------
  # 英文 Prompt
  # ----------------------------------------------------------

  system_prompt_en: |
    You are an academic paper assistant focusing on
    Social Event Detection and social media analysis.

    Based on the paper title, metadata, and abstract,
    provide a short summary explaining:

    1. what problem the paper studies,
    2. what main method it uses,
    3. what main conclusion it reports.

    Keep the summary concise and objective.
    Do not invent information.


  # ----------------------------------------------------------
  # 中文 Prompt
  # ----------------------------------------------------------

  system_prompt_zh: |
    你是一个面向 Social Event Detection
    和社交媒体分析的论文阅读助手。

    根据论文标题、元信息和摘要，
    用简短中文概括：

    1. 论文研究什么问题；
    2. 使用什么主要方法；
    3. 得到什么主要结论。

    保持简洁、客观，
    不要补充原文中没有的信息。


# ============================================================
# 11. 翻译
#
# 关闭额外翻译。
#
# 原因：
# 当前 LLM 摘要已经直接输出中文，
# 没必要再单独调用一次模型翻译摘要，
# 可以明显减少 API 调用次数。
# ============================================================

translate:

  enabled: false

  lang: "zh"

  fields:
    - "title"
    - "summary"


# ============================================================
# 12. GitHub Pages
# ============================================================

site:

  enabled: true

  dir: "docs"

  title: "Social Event Detection 论文速递"

  keep_runs: 1024

  theme: "light"

  accent: "#2563eb"


# ============================================================
# 13. Freshness & 去重
#
# 最近 7 天窗口。
#
# seen.json 负责跨天去重。
# ============================================================

freshness:

  since_days: 7

  unique_only: true

  state_path: ".state/seen.json"

  # 没有新论文时不要使用旧论文凑数量
  fallback_when_empty: false


# ============================================================
# 14. 代码 / 项目主页抓取
# ============================================================

scrape:

  # 优先从 arXiv HTML 页面寻找代码链接
  html: true

  # HTML 没找到时再尝试 PDF
  pdf_if_missing: true

  # 不主动扫描所有 PDF 第一页
  pdf_first_page: false

  # HTTP 超时时间
  timeout: 10
